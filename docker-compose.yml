services:
  backend:
    build: .
    container_name: openscope-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://openscope-db:3306/openscope
      SPRING_DATASOURCE_USERNAME: openscope
      SPRING_DATASOURCE_PASSWORD: openscope
    networks:
      - openscope-net

networks:
  openscope-net:
    external: true
